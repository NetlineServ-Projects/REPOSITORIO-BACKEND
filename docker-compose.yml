x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# No Coolify, as variáveis SERVICE_* são geradas e guardadas por ele (palavras-passe, utilizador e
# domínio). As restantes têm de ser definidas no recurso; as marcadas com :? são obrigatórias.
services:
  api:
    image: netlineserv/repositorio-backend:${IMAGE_TAG:-demo}
    pull_policy: always
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    # O CMD da imagem (npm run start:prod) aplica as migrações e o seed antes de arrancar a API
    environment:
      - SERVICE_FQDN_API_3000
      - NODE_ENV=production
      - PORT=3000
      - TZ=${TZ:-Africa/Maputo}
      - JWT_SECRET=${SERVICE_PASSWORD_64_JWT}
      # 64 caracteres hex (openssl rand -hex 32), definida à mão e guardada fora do Coolify:
      # se mudar ou se perder, as credenciais encriptadas na BD deixam de poder ser lidas
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?}
      - DATABASE_URL=mysql://${SERVICE_USER_MYSQL}:${SERVICE_PASSWORD_MYSQL}@db:3306/${MYSQL_DATABASE:-repositorio}
      # Endereço exato do frontend (CORS com credenciais)
      - FRONTEND_URL=${FRONTEND_URL:?}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      # Documentação Swagger em /api/v1/docs ("false" desliga-a)
      - API_DOCS=${API_DOCS:-true}
      # Dias que os registos de auditoria ficam guardados ("0" = para sempre)
      - AUDITORIA_RETENCAO_DIAS=${AUDITORIA_RETENCAO_DIAS:-180}
      # Administrador criado pelo seed, só se ainda não existir
      - ADMIN_NOME=${ADMIN_NOME:-Administrador}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_SENHA=${SERVICE_PASSWORD_ADMIN}
      - ADMIN_NUMERO=${ADMIN_NUMERO:-}
      - ADMIN_CARGO=${ADMIN_CARGO:-Administrador}
      - ADMIN_DEPARTAMENTO=${ADMIN_DEPARTAMENTO:-}
    expose:
      - "3000"
    volumes:
      # Volumes nomeados: herdam o dono "node" da imagem (bind mounts ficariam root → EACCES)
      - repositorio_uploads:/usr/src/app/uploads
      - repositorio_logs:/usr/src/app/logs
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging: *logging

  db:
    image: mysql:8.4
    restart: unless-stopped
    stop_grace_period: 60s
    command:
      - --mysql-native-password=ON
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=64M
      # O Prisma lê as datas como UTC: o TZ só muda a hora dos registos, não o NOW() da BD
      - --default-time-zone=+00:00
    environment:
      - TZ=${TZ:-Africa/Maputo}
      - MYSQL_ROOT_PASSWORD=${SERVICE_PASSWORD_MYSQLROOT}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-repositorio}
      - MYSQL_USER=${SERVICE_USER_MYSQL}
      - MYSQL_PASSWORD=${SERVICE_PASSWORD_MYSQL}
    volumes:
      - repositorio_db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -uroot --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    logging: *logging

volumes:
  repositorio_db_data:
  repositorio_uploads:
  repositorio_logs:
