services:
  api:
    build: .
    container_name: repositorio-backend-api
    env_file:
      - .env
    networks:
      - repositorionet
    ports:
      - ${HOST_PORT}:${PORT}
    restart: always
    user: "node"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}
      - PORT=${PORT}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=production

    volumes:
      - ./uploads:/usr/src/app/uploads
      - ./logs:/usr/src/app/logs

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:${PORT}/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: mysql:8
    container_name: repositorio-backend-db
    command: --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    networks:
      - repositorionet
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_HOST_PORT}:${DB_PORT}"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
networks:
  repositorionet:
    driver: bridge

volumes:
  db_data:
