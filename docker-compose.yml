services:
  api:
    image: netlineserv/repositorio-backend:${IMAGE_TAG:-demo}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Migrações correm sempre antes da API arrancar
    command: sh -c "./node_modules/.bin/prisma migrate deploy && exec npm run start:prod"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?}
      # Se a password tiver caracteres especiais (@ : / # ?), tem de estar URL-encoded
      DATABASE_URL: mysql://${DB_USER:?}:${DB_PASSWORD:?}@db:3306/${DB_NAME:?}
    expose:
      - "3000"
    volumes:
      # Volumes nomeados: herdam o dono "node" da imagem (bind mounts ficariam root → EACCES)
      - repositorio_uploads:/usr/src/app/uploads
      - repositorio_logs:/usr/src/app/logs
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --mysql-native-password=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${DB_NAME:?}
      MYSQL_USER: ${DB_USER:?}
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - repositorio_db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  repositorio_db_data:
  repositorio_uploads:
  repositorio_logs:
