# Só para desenvolvimento local: o "docker compose" carrega este ficheiro sozinho quando
# não se passa -f. O Coolify e o pipeline usam "-f docker-compose.yml" e ignoram-no.
#
# O docker-compose.yml usa as variáveis SERVICE_* que o Coolify gera. Localmente não existem,
# por isso aqui as credenciais vêm das variáveis do .env (DB_*, JWT_SECRET, ADMIN_SENHA).
# Sem isto o MySQL arranca sem palavra-passe de root e fica sempre a reiniciar.
services:
  api:
    image: repositorio-backend:local
    build: .
    pull_policy: build
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=mysql://${DB_USER:?}:${DB_PASSWORD:?}@db:3306/${DB_NAME:?}
      - JWT_SECRET=${JWT_SECRET:?}
      - ADMIN_SENHA=${ADMIN_SENHA:-}
      # Localmente o frontend corre em http, sem HTTPS
      - COOKIE_SECURE=${COOKIE_SECURE:-false}

  db:
    # Só acessível a partir da própria máquina
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:?}
      - MYSQL_DATABASE=${DB_NAME:?}
      - MYSQL_USER=${DB_USER:?}
      - MYSQL_PASSWORD=${DB_PASSWORD:?}
    volumes:
      # O volume local que já tem os dados (o docker-compose.yml usa outro nome, o do Coolify)
      - db_data:/var/lib/mysql

volumes:
  db_data:
